<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollie Ellis — engineering projects</title>
<meta name="description" content="Mechanical and aerospace engineering projects, test hardware and things built by Ollie Ellis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#E7E9EA;
  --panel:#F5F6F6;
  --ink:#14243A;
  --ink-soft:#5C6875;
  --line:#C6CBCF;
  --accent:#0F5FD6;
  --max:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(15,95,214,.35)}
a:hover{border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
img{display:block;width:100%;height:100%;object-fit:cover}

.wrap{max-width:var(--max);margin:0 auto;padding:0 28px}

/* ---------- header ---------- */
header{padding:76px 0 0}
.name{
  font-size:clamp(2.6rem,7vw,5.1rem);
  font-weight:700;
  letter-spacing:-.035em;
  line-height:.98;
  margin:0;
}
.tagline{
  max-width:48ch;
  margin:22px 0 0;
  font-size:clamp(1.05rem,2vw,1.28rem);
  color:var(--ink-soft);
}
.contact{
  display:flex;flex-wrap:wrap;gap:8px 26px;
  margin:30px 0 0;padding:0;list-style:none;
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:.84rem;
}
.rule{height:1px;background:var(--line);margin:56px 0 0}

/* ---------- hero image ---------- */
.hero{
  margin:0;
  aspect-ratio:21/8;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  overflow:hidden;
}
.hero figcaption{
  max-width:var(--max);margin:0 auto;padding:10px 28px 0;
  font-size:.82rem;color:var(--ink-soft);
}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:200px 1fr;gap:56px;padding:64px 0 0}
nav.index{position:sticky;top:40px;align-self:start}
nav.index h2{
  font-size:.82rem;font-weight:600;color:var(--ink-soft);
  margin:0 0 14px;letter-spacing:.02em;
}
nav.index ol{list-style:none;margin:0;padding:0}
nav.index ol + h2{margin-top:24px}
nav.index li{margin:0 0 9px}
nav.index a{
  color:var(--ink);border:0;font-size:.95rem;
  display:block;padding-left:12px;border-left:2px solid var(--line);
}
nav.index a:hover,nav.index a.on{border-left-color:var(--accent);color:var(--accent)}

/* ---------- projects ---------- */
article.project{padding:0 0 76px;scroll-margin-top:30px}
article.project + article.project{border-top:1px solid var(--line);padding-top:52px}
.cathead{font-size:clamp(1.15rem,2.2vw,1.4rem);letter-spacing:-.015em;margin:0 0 30px;padding-bottom:10px;border-bottom:2px solid var(--ink);font-weight:600}
section.cat + section.cat{padding-top:48px}
.ptitle{font-size:clamp(1.5rem,3vw,2.05rem);letter-spacing:-.02em;line-height:1.1;margin:0}
.pmeta{
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:.8rem;color:var(--ink-soft);margin:9px 0 0;
}
.psummary{max-width:66ch;margin:20px 0 0}
.psummary p{margin:0 0 13px}

.shots{display:grid;gap:10px;margin:26px 0 0}
.shot{background:var(--panel);border:1px solid var(--line);overflow:hidden;position:relative}
.shot.lead{aspect-ratio:3/2}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumbs .shot{aspect-ratio:1/1}
button.shot{padding:0;cursor:zoom-in;display:block;width:100%;font:inherit;color:inherit}
.ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:14px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:.74rem;color:var(--ink-soft);
  background:repeating-linear-gradient(45deg,transparent 0 9px,rgba(20,36,58,.045) 9px 18px);
}

.specs{margin:26px 0 0;max-width:430px;border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;gap:20px;padding:7px 0;border-bottom:1px solid var(--line)}
.specs dt{font-size:.88rem;color:var(--ink-soft);margin:0}
.specs dd{margin:0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.85rem;text-align:right}

/* ---------- toolbox + footer ---------- */
section.tools{border-top:1px solid var(--line);padding:52px 0 0}
section.tools h2,footer h2{font-size:1.3rem;letter-spacing:-.015em;margin:0 0 18px}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px}
.toolgrid h3{font-size:.85rem;color:var(--ink-soft);font-weight:600;margin:0 0 6px}
.toolgrid p{margin:0;font-size:.95rem}
footer{padding:62px 0 80px;margin-top:56px;border-top:1px solid var(--line)}
footer p{max-width:52ch;color:var(--ink-soft)}

/* ---------- lightbox ---------- */
#box{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(20,36,58,.94);padding:4vh 4vw;cursor:zoom-out;
}
#box.open{display:flex;align-items:center;justify-content:center}
#box img{width:auto;height:auto;max-width:100%;max-height:92vh;object-fit:contain}

@media(max-width:820px){
  body{font-size:16px}
  .cols{grid-template-columns:1fr;gap:0;padding-top:40px}
  nav.index{display:none}
  .hero{aspect-ratio:4/3}
  header{padding-top:48px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ==================================================================
     EDIT EVERYTHING FROM HERE
     ==================================================================
     1. ME  — your name, one-line description, contact links.
     2. CATEGORIES — the groups, in the order they appear on the page.
          Delete any you don't use; empty groups are skipped automatically.
     3. PROJECTS — one { } block per project. Copy a block to add more.
          category: must match a key in CATEGORIES ("engineering", "carpentry"...).
          Anything with no category, or an unknown one, lands under "other".
          images: file names inside the images/ folder.
                  First image is the big one, next three become thumbnails.
                  Leave an empty list [] and a placeholder box shows instead.
     4. TOOLS — the skills panel near the bottom.
     Nothing below the "STOP EDITING" line needs touching.
================================================================== -->

<script>
const ME = {
  name: "Ollie Ellis",
  tagline: "Mechanical Engineering student at Dartmouth, looking to work in the aerospace sector. Experienced with rapid prototyping, CAD, dynamic testing, and project management.", 
  links: [
    ["email", "mailto:ojtellis@gmail.com"],
    ["LinkedIn", "https://linkedin.com/in/ollie-ellis"],
    ["CV (PDF)", "cv.pdf"]
  ],
  heroImage: "",                       // e.g. "hero.jpg" — a wide shot of your best build
  heroCaption: "Vibration test setup, RAL Space."
};

const CATEGORIES = [
  ["coursework", "Coursework"],
  ["construction",   "Construction"],
  ["random",   "Random / Personal"],
  ["other",       "Other"]
];

const PROJECTS = [
  {
    category: "coursework",
    name: "Crane bot",
    meta: "ENGS076 Machine Engineering · fall 2025",
    images: ["crane-1.jpeg", "crane-2.jpeg", "crane-3.jpeg", "crane-4.jpeg", "crane-5.jpeg", "crane-6.jpeg", "crane-8.jpeg"],
    summary: [
      "Led design/build/test work on an RC crane class project. I designed the full gripper module, the boom traverse mechanism, the mast, and parts of the worm gearbox.", 
      "I learned a lot about 3D design, working with complex assemblies, rapid prototyping, fabrication, testing, and project management. I was proud to be selected as my team's bot operator, and also to have won the 'most effective gripper' prize with my design.",
      "This class was my favourite at Dartmouth and I am excited to return to it in Fall 2026 as a Teaching Assistant."    
    ],
    specs: [
      ["Mechanism", "parallelogram linkage"],
      ["Gears", "3D printed, weight-optimised"],
      ["Result", "most effective gripper"]
    ]
  },
  {
    category: "coursework",
    name: "Model Truss Bridge",
    meta: "ENGS033 · structural design & test · 2024",
    images: ["bridge-1.jpeg", "bridge-2.jpeg", "bridge-3.jpeg", "bridge-4.jpeg", "bridge-5.jpeg"],
    summary: [
      "As part of a Solid Mechanics class I designed and modelled a truss bridge using SolidWorks, FEA tools, and SAP2000, and tested the plywood model to failure using an Instron machine.",
      "The failure mode ended up being a floor beam tenon shearing at the joint with the side panel, which was different to the prediction of failure at the support point.",
      "This taught me that analytical models can only get you so far, and stringent physical testing is necessary as part of any design process.   "
    ],
  },
  {
    category: "coursework",
    name: "Modular Aerial Vehicle",
    meta: "ENGS89/90 capstone · CAD & sponsor liaison · 2026",
    images: ["MAV-1.jpg", "MAV-2.jpg", "MAV-3.jpg", "MAV-4.jpg"],
    summary: [
      "For my capstone project I was part of a team working on designing a Group-2 class UAV, optimised to be 3D printed using selective laser sintering in one print bed.",
      "On this project I was responsible for the CAD work on the nosecone, empennage, fuselage module connections, and parts of the wing root. I also served as my team's",
      "liasion with our sponsor company, EOS. In this position I handled all communications between our team and EOS, including arranging meetings and creating agendas."
    ],
    specs: [
      ["Project Management", "SolidWorks"],
      ["Sponsor", "EOS GmbH"]
    ]
  },
  {
    category: "coursework",
    name: "High Altitude Balloon Project",
    meta: "personal / team project",
    images: ["HAB-1.jpg", "HAB-2.jpeg", "HAB-3.jpeg", "HAB-4.jpeg", "HAB-5.jpeg"],
    summary: [
      "This was an extracurricular project to compare NO2 concentration altitude profiles between central London and Cambridgeshire.",
      "To do this we developed a payload with a sensor suite and cameras, and launched four times to 30km altitude from both locations.",
      "I worked on the payload structural design using Fusion360, balancing weight optimisation with impact and waterproofing requirements",
      "iteratively improving the design until the payload could survive fairly hard landings unscathed."
    ],
    specs: [
      ["Altitude", "~30 km"],
      ["Measurement", "NO₂ concentration profile"],
      ["CAD", "Fusion360"]
    ]
  },
  {
    category: "random",
    name: "Coring bit fabrication",
    meta: "Planetary Ice Research Lab · fabrication",
    images: ["coringbit-1.jpeg", "coringbit-2.jpeg", "coringbit-3.jpeg", "coringbit-4.jpeg"],
    summary: [
      "I fabricated a new coring bit for the Planetary Ice Research Lab at Dartmouth, who wanted to investigate the possibility of making longer bits in house to save money. During this project I gained experience with using the mill, lathe, plasma cutter, MIG welding, and brazing. My bit successfully drilled the hole pictured, but more work is needed to allow for cleaner core extraction and less frequent jamming. "
    ],
    specs: [
      ["Processes", "lathe, mill, MIG welding, brazing, plasma cutting"],
      ["Application", "ice core drilling"]
    ]
  },
    {
    category: "random",
    name: "Lamp",
    meta: "GCSE design project",
    images: ["lamp-1.jpeg", "lamp-2.jpeg", "lamp-3.jpeg", "lamp-4.jpeg"],
    summary: [
      "I made this lamp as my culminating design project for Product Design GCSE. The base is made from birch plywood, supported by 6 aluminium feet that I turned on a lathe. The shade is made from translucent acrylic panes, lit by a squirrel cage LED bulb."
    ],
  },
  {
    category: "construction",
    name: "Foundations for a cabin, Sitka AK",
    meta: "personal build · 2023",
    images: ["cabin-1.jpg", "cabin-2.jpeg", "cabin-3.jpeg", "cabin-4.jpeg", "cabin-5.jpeg"],
    summary: [
      "In summer 2023 I helped dig the foundations and build the substructure for a friend's cabin on an island near Sitka, AK. We dug foundation holes, drove piles into the topsoil, poured concrete, and installed posts, beams and joists. Over half of the work and fun was getting all the building materials out to the island which had no dock or beach using a Boston Whaler!"
    ],
  },
    {
    category: "construction",
    name: "Bathroom with a view, Sitka AK",
    meta: "personal build · 2023",
    images: ["longdrop-1.jpeg", "longdrop-4.jpeg", "longdrop-5.jpeg", "longdrop-2.jpeg", "longdrop-3.jpeg"],
    summary: [
      "I built a pit latrine bathroom for the cabin I worked on with my friend on an island near Sitka, AK. The bathroom offers unparalleled views over Sitka Sound toward Mt Edgecumbe, and features a covered toilet paper holder."
    ],
  },
  {
    category: "random",
    name: "Silver Necklace Pendant",
    meta: "personal · 2026",
    images: ["necklace-1.jpeg", "necklace-2.jpeg","necklace-3.jpeg"],
    summary: [
      "This was a gift for my mum that I made using braising, laser engraving, and various other fine metalwork shaping and finishing processes."
    ],
  }
  {
    category: "random",
    name: "Africa Language Families Map Puzzle",
    meta: "personal · 2026",
    images: ["africapuzzle-1.jpeg", "africapuzzle-2.jpeg","africapuzzle-3.jpeg"],
    summary: [
      "This was a final project I made for an African Linguistics class. I synthesised 38 separate language families into a more manageable 21 groups, outlined the map using CorelDraw, laser cut the DXFs, and colour coded the pieces."
    ],
  }
];

const TOOLS = [
  ["CAD & analysis", "SolidWorks (CSWA certified, CSWP in progress), Fusion360, SAP2000"],
  ["Fabrication", "Manual lathe, TIG welding, brazing, plasma and laser cutting, 3D printing, carpentry"],
  ["Computation", "MATLAB, C, Excel/VBA"],
  ["Test", "Vibration and shock qualification, Instron, cleanroom practice"]
];

const CLOSING = "Currently finishing a BE in Mechanical Engineering at Dartmouth and looking for work in launch and spacecraft hardware. Happy to talk through any of the above in more detail.";
</script>

<!-- ============================ STOP EDITING ============================ -->

<header>
  <div class="wrap">
    <h1 class="name" id="me-name"></h1>
    <p class="tagline" id="me-tagline"></p>
    <ul class="contact" id="me-links"></ul>
  </div>
  <div class="rule"></div>
</header>

<figure class="hero" id="hero"></figure>
<p class="wrap" id="hero-cap" style="font-size:.82rem;color:var(--ink-soft);margin:10px auto 0"></p>

<div class="wrap cols">
  <nav class="index" aria-label="Projects">
    <h2>Projects</h2>
    <ol id="nav-list"></ol>
  </nav>

  <main id="main"></main>
</div>

<div class="wrap">
  <section class="tools">
    <h2>Tools and processes</h2>
    <div class="toolgrid" id="toolgrid"></div>
  </section>

  <footer>
    <h2>Get in touch</h2>
    <p id="closing"></p>
    <ul class="contact" id="me-links-2"></ul>
  </footer>
</div>

<div id="box" role="dialog" aria-modal="true" aria-label="Enlarged photo"><img alt=""></div>

<script>
const el = (t,c) => { const n=document.createElement(t); if(c) n.className=c; return n; };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const linkList = node => ME.links.forEach(([label,href]) => {
  const li = el("li"), a = el("a");
  a.textContent = label; a.href = href;
  if(/^https?:/.test(href)){ a.target="_blank"; a.rel="noopener"; }
  li.appendChild(a); node.appendChild(li);
});

document.title = ME.name + " — engineering projects";
document.getElementById("me-name").textContent = ME.name;
document.getElementById("me-tagline").textContent = ME.tagline;
linkList(document.getElementById("me-links"));
linkList(document.getElementById("me-links-2"));
document.getElementById("closing").textContent = CLOSING;

// hero
const hero = document.getElementById("hero");
if(ME.heroImage){
  hero.appendChild(makeImg(ME.heroImage, ME.name + " — hero image"));
  document.getElementById("hero-cap").textContent = ME.heroCaption || "";
}else{
  hero.appendChild(placeholder("images/hero.jpg — wide shot, ~2000px across"));
}

function makeImg(file, alt){
  const img = el("img");
  img.src = "images/" + file;
  img.alt = alt || "";
  img.loading = "lazy";
  img.onerror = () => { const p = img.parentElement; img.remove(); p.appendChild(placeholder("images/" + file + " not found")); };
  return img;
}
function placeholder(text){
  const d = el("div","ph"); d.textContent = text; return d;
}

// projects
const main = document.getElementById("main");
const navWrap = document.getElementById("nav-list").parentElement;
document.getElementById("nav-list").remove();
document.querySelector("nav.index h2").remove();

CATEGORIES.forEach(([key,label]) => {
  const group = PROJECTS.filter(p => (p.category || "other") === key);
  if(!group.length) return;

  const navHead = el("h2"); navHead.textContent = label; navWrap.appendChild(navHead);
  const navOl = el("ol"); navWrap.appendChild(navOl);

  const sec = el("section","cat");
  const ch = el("h2","cathead"); ch.textContent = label; sec.appendChild(ch);
  main.appendChild(sec);

  group.forEach(p => renderProject(p, sec, navOl));
});

function renderProject(p, sec, navOl){
  const id = slug(p.name);

  const navLi = el("li"), navA = el("a");
  navA.href = "#" + id; navA.textContent = p.name; navA.dataset.for = id;
  navLi.appendChild(navA); navOl.appendChild(navLi);

  const art = el("article","project"); art.id = id;
  const h = el("h3","ptitle"); h.textContent = p.name; art.appendChild(h);
  if(p.meta){ const m = el("p","pmeta"); m.textContent = p.meta; art.appendChild(m); }

  const sum = el("div","psummary");
  (p.summary||[]).forEach(t => { const par = el("p"); par.textContent = t; sum.appendChild(par); });
  art.appendChild(sum);

  const shots = el("div","shots");
  const imgs = p.images || [];
  const lead = el("button","shot lead");
  lead.type = "button";
  if(imgs[0]){ lead.appendChild(makeImg(imgs[0], p.name)); lead.dataset.src = "images/" + imgs[0]; }
  else { lead.appendChild(placeholder("images/" + id + "-1.jpg")); lead.style.cursor = "default"; }
  shots.appendChild(lead);

  if(imgs.length > 1){
    const row = el("div","thumbs");
    imgs.slice(1).forEach(f => {
      const b = el("button","shot"); b.type="button";
      b.appendChild(makeImg(f, p.name)); b.dataset.src = "images/" + f;
      row.appendChild(b);
    });
    shots.appendChild(row);
  }
  art.appendChild(shots);

  if(p.specs && p.specs.length){
    const dl = el("dl","specs");
    p.specs.forEach(([k,v]) => {
      const row = el("div"), dt = el("dt"), dd = el("dd");
      dt.textContent = k; dd.textContent = v;
      row.append(dt,dd); dl.appendChild(row);
    });
    art.appendChild(dl);
  }
  sec.appendChild(art);
}

// tools
const tg = document.getElementById("toolgrid");
TOOLS.forEach(([head,body]) => {
  const d = el("div"), h = el("h3"), p = el("p");
  h.textContent = head; p.textContent = body;
  d.append(h,p); tg.appendChild(d);
});

// lightbox
const box = document.getElementById("box"), boxImg = box.querySelector("img");
document.addEventListener("click", e => {
  const b = e.target.closest("button.shot");
  if(b && b.dataset.src){ boxImg.src = b.dataset.src; box.classList.add("open"); return; }
  if(e.target.closest("#box")) box.classList.remove("open");
});
document.addEventListener("keydown", e => { if(e.key === "Escape") box.classList.remove("open"); });

// active nav state
const links = [...document.querySelectorAll("nav.index a")];
const obs = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if(en.isIntersecting) links.forEach(a => a.classList.toggle("on", a.dataset.for === en.target.id));
  });
}, { rootMargin: "-15% 0px -70% 0px" });
document.querySelectorAll("article.project").forEach(a => obs.observe(a));
</script>
</body>
</html>
